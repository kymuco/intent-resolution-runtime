name: Materialize M1.4 R8 ASCII closure

on:
  push:
    branches:
      - m1.4/binding-symbolic-reference-ir

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ contains(github.event.head_commit.message, 'm1.4/r8-ascii-materializer-stage') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize corrected R8 candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python tools/r8_ascii_materialize.py
